services:
  romestead:
    build: .
    container_name: romestead_server
    restart: unless-stopped
    ports:
      - "5555:80"           # Akses Web Panel (Host: 5555 -> Container: 80)
      - "5580:5580/tcp"     # Game Traffic
      - "5580:5580/udp"     # Game Traffic
    volumes:
      - .:/var/www/html     # Semua file (web + game) ada di sini
